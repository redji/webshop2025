services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webshop}
      POSTGRES_DB: ${POSTGRES_DB:-webshop}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-webshop} -d ${POSTGRES_DB:-webshop}']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-webshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-webshop}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-webshop}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-webshop}
      DATABASE_NAME: ${POSTGRES_DB:-webshop}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-webshop}:${RABBITMQ_PASSWORD:-webshop}@rabbitmq:5672
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-http://localhost:3001/auth/microsoft/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3001/auth/facebook/callback}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_DISABLED: ${RECAPTCHA_DISABLED:-false}
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-facing URL (baked into client bundle at image build).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Server-side RSC fetches use the Compose DNS name (not localhost).
      API_URL: ${API_URL:-http://api:3001}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

  # Local SonarQube Community Build (profile: sonar).
  # Uses embedded H2 for local/dev trial only — not for production.
  # Start: docker compose --profile sonar up -d sonarqube
  # UI: http://localhost:9000  (first login admin / admin — change immediately)
  sonarqube:
    image: sonarqube:community
    profiles: ['sonar']
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    ports:
      - '${SONAR_PORT:-9000}:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:9000/api/system/status 2>/dev/null | grep -q UP || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot analysis against the local SonarQube service (compose network).
  # Requires SONAR_TOKEN in .env (create a user token in the Sonar UI).
  # Run: docker compose --profile sonar run --rm sonar-scanner
  # Or:  npm run sonar:scan
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:11
    profiles: ['sonar']
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      # Inside Compose, reach Sonar by service name (not localhost).
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
    working_dir: /usr/src

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
